name: Edge configuration
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
# PR and dev pushes cancel superseded runs; main runs always finish.
concurrency:
  group: edge-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract pinned Caddy binary
        run: |
          image=$(docker compose --env-file .env.example config --no-env-resolution --format json |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["services"]["caddy"]["image"])')
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/caddy" /tmp/caddy
          chmod +x /tmp/caddy
      - name: Report Compose version
        run: docker compose version
      - name: Validate proxy identity and compose isolation
        env:
          CADDY_BIN: /tmp/caddy
        run: python3 -m unittest discover -s tests -v
