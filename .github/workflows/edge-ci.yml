name: Edge configuration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A new push to a PR cancels its superseded run; main runs always finish.
concurrency:
  group: edge-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract pinned Caddy binary
        run: |
          container=$(docker create caddy:2.11.4)
          docker cp "$container:/usr/bin/caddy" /tmp/caddy
          docker rm "$container"
          chmod +x /tmp/caddy
      - name: Report Compose version
        run: docker compose version
      - name: Validate proxy identity and compose isolation
        env:
          CADDY_BIN: /tmp/caddy
        run: python3 -m unittest discover -s tests -v
