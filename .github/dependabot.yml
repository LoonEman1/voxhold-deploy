version: 2
# Dependabot reads this file from main, but its PRs go to dev like every other
# change: main only takes reviewed release PRs from dev.
# Monthly runs, one PR for minor/patch and one for majors per ecosystem.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
  # Images are pinned in compose.yaml (caddy, coturn); there is no Dockerfile.
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
