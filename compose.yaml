# Bounded json-file logs everywhere: unbounded default logs eventually fill
# small VPS disks.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    image: ${VOXHOLD_BACKEND_IMAGE:-ghcr.io/looneman1/voxhold-backend:latest}
    logging: *default-logging
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p "$$(dirname "$$DATABASE_PATH")"
        if [ "$$RESET_DATABASE" = "true" ]; then
          echo "refusing RESET_DATABASE=true in production deploy"
          exit 1
        fi
        exec migrate \
          -path "$$MIGRATIONS_PATH" \
          -database "sqlite://$$DATABASE_PATH" \
          up
    volumes:
      - voxhold_data:/app/data
    networks:
      - app
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  bootstrap:
    image: ${VOXHOLD_BACKEND_IMAGE:-ghcr.io/looneman1/voxhold-backend:latest}
    logging: *default-logging
    env_file:
      - .env
    entrypoint: ["voxhold-bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - voxhold_data:/app/data
    networks:
      - app
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${VOXHOLD_BACKEND_IMAGE:-ghcr.io/looneman1/voxhold-backend:latest}
    logging: *default-logging
    env_file:
      - .env
    # Memory guardrail only; no CPU hard limit so media throughput is never
    # throttled. Tune after observing real usage (docker stats).
    mem_limit: 768m
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    expose:
      - "8080"
    ports:
      - "${WEBRTC_UDP_PORT:-50000}:${WEBRTC_UDP_PORT:-50000}/udp"
      - "${WEBRTC_STREAM_UDP_PORT:-50001}:${WEBRTC_STREAM_UDP_PORT:-50001}/udp"
    volumes:
      - voxhold_data:/app/data
    networks:
      - app
    restart: "${VOXHOLD_RESTART_POLICY:-unless-stopped}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ${VOXHOLD_FRONTEND_IMAGE:-ghcr.io/looneman1/voxhold-frontend:latest}
    logging: *default-logging
    profiles: ["web"]
    environment:
      BACKEND_UPSTREAM: backend:8080
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "${VOXHOLD_FRONTEND_PORT:-8080}"
    networks:
      - app
    restart: "${VOXHOLD_RESTART_POLICY:-unless-stopped}"
    # Same hardening the official frontend compose uses and verifies.
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    mem_limit: 192m
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  caddy:
    image: caddy:2.11.4-alpine
    logging: *default-logging
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
      EDGE_UPSTREAM: ${EDGE_UPSTREAM:-backend:8080}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${VOXHOLD_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    restart: "${VOXHOLD_RESTART_POLICY:-unless-stopped}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true

  coturn:
    # Optional TURN relay for WebRTC clients: browser voice and server-stream
    # sessions use it as fallback, and P2P connections rely on it when direct
    # UDP paths fail. Enabled via the "turn" profile in COMPOSE_PROFILES.
    image: coturn/coturn:4-alpine
    logging: *default-logging
    profiles: ["turn"]
    # Bypass the image entrypoint: it runs every argument through
    # "eval echo", which turns "-n" into an empty string (echo's own flag)
    # and would execute $(...) inside argument values.
    entrypoint: ["turnserver"]
    command:
      - "-n"
      - "--listening-port=${TURN_LISTEN_PORT:-3478}"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--user=${TURN_USERNAME:-voxhold}:${TURN_PASSWORD:-}"
      - "--realm=${TURN_REALM:-voxhold}"
      - "--external-ip=${WEBRTC_PUBLIC_IP:-}"
      - "--min-port=${TURN_RELAY_PORT_MIN:-49160}"
      - "--max-port=${TURN_RELAY_PORT_MAX:-49559}"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--no-multicast-peers"
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.0.0.0-192.0.0.255"
      - "--denied-peer-ip=192.0.2.0-192.0.2.255"
      - "--denied-peer-ip=192.88.99.0-192.88.99.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--denied-peer-ip=198.18.0.0-198.19.255.255"
      - "--denied-peer-ip=198.51.100.0-198.51.100.255"
      - "--denied-peer-ip=203.0.113.0-203.0.113.255"
      - "--denied-peer-ip=224.0.0.0-255.255.255.255"
      - "--denied-peer-ip=::1-::1"
      - "--denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      - "--denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      - "--denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      - "--stale-nonce=600"
      # TURN_USERNAME is shared by all clients, so a per-user quota would cap
      # the whole instance. Keep user-quota at 0 and bound total allocations
      # with total-quota until per-user REST credentials are introduced.
      - "--user-quota=${TURN_USER_QUOTA:-0}"
      - "--total-quota=${TURN_TOTAL_QUOTA:-400}"
      - "--pidfile=/tmp/coturn.pid"
      - "--simple-log"
    # Host networking: coturn binds 3478 and the relay range directly on the
    # host. Publishing the 100-port relay range normally spawns one
    # docker-proxy process per port (~300 MB RAM overhead).
    network_mode: host
    # TURN keeps one socket pair per relay allocation; the host default
    # (observed: 524288) is fine, this guardrail only prevents a lower
    # inherited limit from breaking allocations.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 384m
    volumes:
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    read_only: true
    cap_drop: ["ALL"]
    # turnserver binary ships with setcap cap_net_bind_service; exec fails
    # with EPERM (exit 126) unless this capability stays available.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    restart: "${VOXHOLD_RESTART_POLICY:-unless-stopped}"

volumes:
  voxhold_data:
  caddy_data:
  caddy_config:

networks:
  app:
